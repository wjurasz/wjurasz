name: Generate Pac-Man Contribution Graph

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering of the workflow
  workflow_dispatch:

  # Trigger the workflow on pushes to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Required so the deploy step can push to the "output" branch
    permissions:
      contents: write

    steps:
      # Step 1: Generate the Pac-Man contribution graph SVG(s)
      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Comma-separated list of games to generate.
          # Options: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "pacman"

      # Step 2: Deploy the generated SVGs to the 'output' branch
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
